[package]
name = "wispkey"
version = "0.4.0"
edition = "2024"
authors = ["Miguel A. Lopez <miguel@rankupgames.com>"]
description = "Local-first credential firewall for AI agents with wisp token proxy"
license = "Apache-2.0"
repository = "https://github.com/rankupgames/wispkey"
readme = "README.md"
keywords = ["credentials", "security", "ai-agents", "proxy", "mcp"]
categories = ["authentication", "command-line-utilities"]

[features]
default = []
vsock = ["dep:tokio-vsock"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP proxy
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full", "http1", "http2", "client-legacy", "tokio"] }
http-body-util = "0.1"
bytes = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Encryption
ring = "0.17"
argon2 = { version = "0.5", features = ["std"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Cloud sync (API client)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# TLS provider (explicit dep so we can install the process-wide CryptoProvider at startup)
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
glob-match = "0.2"
rpassword = "7"
regex = "1"
hyper-rustls = { version = "0.27.8", features = ["http1", "http2", "ring"] }
open = "5.3.3"
urlencoding = "2.1.3"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = { version = "=0.7.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"
