name: Windows receiver test artifact

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-receiver-test-artifact.yml'
      - 'scripts/windows_receiver_artifact.py'
      - 'scripts/tests/test_windows_receiver_artifact.py'
      - 'docs/windows-receiver-test-artifact.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-receiver-test-artifact.yml'
      - 'scripts/windows_receiver_artifact.py'
      - 'scripts/tests/test_windows_receiver_artifact.py'
      - 'docs/windows-receiver-test-artifact.md'

permissions:
  contents: read

concurrency:
  group: windows-receiver-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CHECKED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKED_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-receiver-test
      - name: Test archive validation and default-off core guards
        run: |
          python3 -B -m unittest discover -s scripts/tests -p test_windows_receiver_artifact.py -v
          cargo test --locked --no-default-features --lib schema
      - name: Test enabled receiver with disposable synthetic vaults
        run: cargo test --locked --no-default-features --features experimental-browser-receiver --lib core::browser_receiver::tests
      - name: Build exact receiver-enabled CLI and native host
        run: |
          cargo build --release --locked --no-default-features --features experimental-browser-receiver --target x86_64-pc-windows-msvc --bin wispkey --bin wispkey-browser-host --message-format=json > cargo-artifacts.json
      - name: Build matching extension without installing packages
        working-directory: browser-extension
        run: |
          node --test tests/*.test.mjs
          node build.mjs
      - name: Package bounded staging bundle with compiler feature evidence
        run: python3 scripts/windows_receiver_artifact.py package --cargo-log cargo-artifacts.json --directory dist --commit "$CHECKED_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unvalidated-windows-receiver-${{ env.CHECKED_SHA }}
          path: dist/wispkey-windows-x64-receiver-test.zip
          retention-days: 1
          if-no-files-found: error

  validate:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKED_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unvalidated-windows-receiver-${{ env.CHECKED_SHA }}
          path: dist
      - name: Verify inventory before native Windows extraction
        shell: pwsh
        run: |
          python scripts/windows_receiver_artifact.py verify --directory dist --commit "$env:CHECKED_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Archive verification failed' }
          Expand-Archive -LiteralPath dist/wispkey-windows-x64-receiver-test.zip -DestinationPath extracted -ErrorAction Stop
          python scripts/windows_receiver_artifact.py smoke --directory dist --extracted extracted --commit "$env:CHECKED_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows staging smoke failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-windows-receiver-${{ env.CHECKED_SHA }}
          path: |
            dist/wispkey-windows-x64-receiver-test.zip
            dist/smoke-report.json
            dist/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error

  provenance:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-windows-receiver-${{ env.CHECKED_SHA }}
          path: dist
      - name: Verify artifact hashes
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-checksums: dist/SHA256SUMS.txt
