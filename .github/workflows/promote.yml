name: Promote & Backmerge

on:
  schedule:
    - cron: '0 4 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compare branches without creating pull requests'
        required: true
        default: true
        type: boolean

concurrency:
  group: promote-and-backmerge
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  reconcile:
    name: Reconcile branches through reviewed PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fixture tests
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_promote.py'
      - name: Compare and prepare promotion PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python3 scripts/promote.py
