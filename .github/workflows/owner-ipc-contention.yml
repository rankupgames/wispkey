name: Windows owner IPC contention

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/owner_ipc/**'
      - 'src/core/**'
      - 'tests/owner_ipc.rs'
      - 'tests/common/**'
      - 'scripts/test-owner-ipc-contention.ps1'
      - '.github/workflows/owner-ipc-contention.yml'
  schedule:
    - cron: '37 8 * * 1'

permissions:
  contents: read

jobs:
  contention:
    name: Three runs, one CPU, fourteen test threads
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Repeat bounded owner IPC checks under CPU contention
        shell: pwsh
        run: ./scripts/test-owner-ipc-contention.ps1
