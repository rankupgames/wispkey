name: Scheduled dependency audit

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/dependency-audit.yml'
      - 'scripts/audit_dependencies.py'
      - 'scripts/tests/test_audit_dependencies.py'

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fixtures:
    name: Audit reporting fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -B -m unittest discover -s scripts/tests -p 'test_audit_dependencies.py'

  audit:
    name: RustSec (${{ matrix.branch }})
    if: github.event_name != 'pull_request'
    needs: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        branch: [main, development, release]
    steps:
      - name: Check out audit tooling from the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check out maintained dependency graph
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ matrix.branch }}
          path: audited
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: scheduled-audit
      - name: Install reviewed audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit current lockfile against freshly fetched RustSec database
        run: python3 scripts/audit_dependencies.py audited/Cargo.lock
