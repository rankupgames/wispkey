name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main, release]

permissions:
  contents: read

jobs:
  vsock:
    name: CLI with Linux AF_VSOCK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: cli-vsock
      - name: Lint feature-enabled CLI and tests
        run: cargo clippy --locked --all-targets --features vsock,experimental-sync -- -D warnings
      - name: Feature-enabled tests (no AF_VSOCK device required)
        run: cargo test --locked --features vsock,experimental-sync

  tray:
    name: Native tray (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Linux webview and tray dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Build embedded tray UI
        working-directory: crates/wispkey-tray/ui
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: native-tray
      - name: Build native tray
        run: cargo build --locked -p wispkey-tray
      - name: Headless tray tests
        run: cargo test --locked -p wispkey-tray

  browser:
    name: Browser extension and tray UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Extension tests
        working-directory: browser-extension
        run: |
          npm ci
          npm test
      - name: Build both browser packages
        working-directory: browser-extension
        run: npm run build
      - name: Build tray UI
        working-directory: crates/wispkey-tray/ui
        run: |
          npm ci
          npm run build
      - name: Browser engine and tray UI fixtures
        working-directory: browser-extension
        run: |
          npx playwright install --with-deps chromium firefox
          npm run test:browser
      - name: Test validation runner
        run: python3 -m unittest discover -s scripts/tests -p 'test_verify.py' -v
      - name: Upload unpacked extensions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wispkey-browser-extensions
          path: browser-extension/dist/

  check:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Cold Windows builds need room for the full suite, release build and cache cleanup.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Format check
        run: cargo fmt --check

      - name: Install cargo-audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Dependency audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo audit

      - name: Clippy
        run: cargo clippy -- -D warnings -W clippy::suspicious -W clippy::style -W clippy::perf -W clippy::complexity

      - name: Tests
        run: cargo test

      - name: PostgreSQL TLS rotation and revocation fixture
        if: matrix.os == 'ubuntu-latest'
        run: bash tests/support/postgres_operation_fixture.sh

      - name: cargo publish --dry-run
        if: matrix.os == 'ubuntu-latest'
        run: cargo publish --dry-run --locked

      - name: Build release
        run: cargo build --release
