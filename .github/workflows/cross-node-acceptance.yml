name: Disposable cross-node acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main, development]
    paths:
      - 'src/operations/**'
      - 'tests/support/cross_node_fixture.py'
      - '.github/workflows/cross-node-acceptance.yml'

permissions:
  contents: read

jobs:
  destinations:
    # Match the OpenSSH container's Ubuntu runtime for the host-built helper.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Install verified kind
        shell: bash
        run: |
          curl --fail --location --silent --show-error https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 --output "$RUNNER_TEMP/kind"
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind' > "$RUNNER_TEMP/kind.sha256"
          (cd "$RUNNER_TEMP" && sha256sum --check kind.sha256)
          chmod 700 "$RUNNER_TEMP/kind"
          echo "KIND=$RUNNER_TEMP/kind" >> "$GITHUB_ENV"
      - name: Real SSH and encrypted Kubernetes acceptance
        run: python3 scripts/verify.py --suite cross-node
