name: macOS staging artifact

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 'Reviewed 40-character commit; must equal the selected workflow ref'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-staging-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CHECKED_SHA: ${{ github.sha }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKED_SHA }}
          persist-credentials: false
      - name: Require the reviewed source and native Apple Silicon runner
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          python3 - <<'PY'
          import os, platform, re, subprocess
          expected = os.environ['EXPECTED_COMMIT']
          assert re.fullmatch(r'[0-9a-f]{40}', expected), 'expected_commit must be a full lowercase SHA'
          assert expected == os.environ['CHECKED_SHA'], 'selected workflow ref changed; review the new commit'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected
          assert platform.system() == 'Darwin' and platform.machine() == 'arm64', 'native Apple Silicon required'
          PY
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-staging-default-off
      - name: Test packaging, native installer and default-off browser guards
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
          cargo test --locked --no-default-features --lib schema
          cargo test --locked --no-default-features --lib browser_host
          cargo test --locked --no-default-features --lib core::browser::tests
      - name: Build CLI and native host without experimental features
        run: cargo build --release --locked --no-default-features --target aarch64-apple-darwin --bin wispkey --bin wispkey-browser-host --message-format=json > cargo-artifacts.json
      - name: Build matching extension without package installation
        working-directory: browser-extension
        run: |
          node --test tests/*.test.mjs
          node build.mjs
      - name: Package exact-source staging bundle
        run: python3 -B scripts/macos_staging_artifact.py package --cargo-log cargo-artifacts.json --directory dist --commit "$CHECKED_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unvalidated-macos-staging-${{ env.CHECKED_SHA }}
          path: dist/wispkey-macos-arm64-staging.zip
          retention-days: 1
          if-no-files-found: error

  validate:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKED_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unvalidated-macos-staging-${{ env.CHECKED_SHA }}
          path: dist
      - name: Verify, extract and smoke only disposable synthetic state
        run: python3 -B scripts/macos_staging_artifact.py smoke --directory dist --commit "$CHECKED_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-macos-staging-${{ env.CHECKED_SHA }}
          path: |
            dist/wispkey-macos-arm64-staging.zip
            dist/smoke-report.json
            dist/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error

  provenance:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-macos-staging-${{ env.CHECKED_SHA }}
          path: dist
      - name: Verify artifact hashes
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-checksums: dist/SHA256SUMS.txt
