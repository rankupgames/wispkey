<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>WispKey login requests</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>WispKey</h1>
  <p>Use this extension only in your separate human-controlled profile. An agent that can read this browser can read filled passwords.</p>
  <p id="origin"></p>
  <label><input id="human" type="checkbox"> This profile is controlled only by me.</label>
  <div id="requests"></div>
  <p id="status" role="status"></p>
  <button id="refresh" type="button">Refresh requests</button>
  <script src="popup.js"></script>
</body></html>
